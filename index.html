<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tes Kamera – Abdi Academy</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --text: #1b2430; --muted: #5b6676;
    --primary: #1f3864; --primary-text: #ffffff; --accent: #2e75b6;
    --ok: #1b7f3b; --err: #b3261e; --warn-bg: #fff4d6; --warn-text: #5c4300; --border: #d5dbe6;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161d; --card: #1b212b; --text: #e8ecf3; --muted: #9aa5b5;
      --primary: #3b6cb7; --primary-text: #ffffff; --accent: #6aa7e6;
      --ok: #5ad083; --err: #ff8a80; --warn-bg: #3b3115; --warn-text: #ffe7a3; --border: #333c4a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 1.4rem; margin: 8px 0 2px; }
  .sub { margin: 0 0 16px; color: var(--muted); font-size: .9rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .btn { display: block; width: 100%; padding: 16px; margin: 8px 0; border: 0; border-radius: 12px;
         font-size: 1.05rem; font-weight: bold; background: var(--primary); color: var(--primary-text); cursor: pointer; }
  .btn.alt { background: var(--accent); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); font-weight: normal; }
  .warn { background: var(--warn-bg); color: var(--warn-text); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-size: .92rem; line-height: 1.4; }
  .warn p { margin: 4px 0; }
  .frame { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #000; border-radius: 14px; overflow: hidden; }
  .frame video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .guide { position: absolute; inset: 15%; border: 3px solid rgba(255,255,255,.85); border-radius: 12px; pointer-events: none; }
  #status { min-height: 2.6em; margin: 12px 0 4px; line-height: 1.4; }
  #status.err { color: var(--err); font-weight: bold; }
  .result-label { color: var(--muted); font-size: .85rem; margin: 10px 0 2px; }
  .result-value { font-size: 1.1rem; font-weight: bold; word-break: break-all; color: var(--ok); }
  details { margin-top: 6px; }
  summary { cursor: pointer; color: var(--accent); padding: 6px 0; }
  input[type=text] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
                     background: var(--bg); color: var(--text); font-size: 1rem; margin: 8px 0; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: .8rem; background: var(--bg); padding: 10px; border-radius: 10px; margin: 6px 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Tes Kamera Absensi</h1>
  <p class="sub">Abdi Academy · halaman uji coba pemindai QR</p>

  <div id="warn" class="warn" hidden></div>

  <section id="pilih" class="card">
    <p style="margin-top:0">Pilih peran. Kamera akan langsung menyala:</p>
    <button class="btn" data-role="Siswa">Saya Siswa</button>
    <button class="btn alt" data-role="Pengajar / Pelatih">Saya Pengajar / Pelatih</button>
  </section>

  <section id="scanner" class="card" hidden>
    <div class="frame">
      <video id="video" playsinline muted autoplay></video>
      <div class="guide"></div>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <button id="retry" class="btn" hidden>Coba lagi</button>
    <button id="cancel" class="btn ghost">Batal</button>
  </section>

  <section id="hasil" class="card" hidden>
    <strong>Berhasil terbaca</strong>
    <p class="result-label">Isi kode</p>
    <div id="resKode" class="result-value"></div>
    <p class="result-label">Peran</p>
    <div id="resPeran"></div>
    <p class="result-label">Cara</p>
    <div id="resCara"></div>
    <p class="result-label">Waktu (WIB)</p>
    <div id="resWaktu"></div>
    <button id="again" class="btn">Scan lagi</button>
    <button id="back" class="btn ghost">Ganti peran</button>
  </section>

  <section class="card">
    <details>
      <summary>Kamera tidak bisa? Masukkan kode manual</summary>
      <input id="manualInput" type="text" placeholder="Ketik isi kode di sini" autocomplete="off">
      <button id="manualBtn" class="btn ghost">Kirim kode</button>
    </details>
    <details>
      <summary>Info teknis (untuk pengecekan)</summary>
      <pre id="diag">Memeriksa…</pre>
    </details>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var video = $('video');
  var statusEl = $('status');
  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var stream = null, rafId = 0, running = false, lastTick = 0, role = '';

  var ua = navigator.userAgent || '';
  var inApp = /FBAN|FBAV|FB_IAB|Instagram|Line\/|MicroMessenger|TikTok|Snapchat|Twitter|WhatsApp|; wv\)/i.test(ua);
  var inFrame = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
  var hasApi = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

  function show(id, on) { $(id).hidden = !on; }
  function setStatus(msg, isErr) { statusEl.textContent = msg; statusEl.className = isErr ? 'err' : ''; }

  // ---- Peringatan awal ----
  (function () {
    var list = [];
    if (!window.isSecureContext) list.push('Halaman ini tidak memakai HTTPS, jadi browser akan memblokir kamera.');
    if (inFrame) list.push('Halaman ini terbuka di dalam frame. Browser bisa memblokir kamera. Buka alamatnya langsung di Chrome atau Safari.');
    if (inApp) list.push('Kamu membuka lewat browser di dalam aplikasi (misalnya WhatsApp atau Instagram). Kamera sering diblokir di sini. Salin link, lalu buka lewat Chrome atau Safari.');
    if (!hasApi) list.push('Browser ini tidak mendukung akses kamera. Coba perbarui browser atau pakai Chrome/Safari.');
    if (list.length) {
      var box = $('warn');
      list.forEach(function (t) { var p = document.createElement('p'); p.textContent = t; box.appendChild(p); });
      box.hidden = false;
    }
  })();

  // ---- Pesan error yang mudah dipahami ----
  function explainError(e) {
    var n = (e && e.name) || '';
    if (n === 'NotAllowedError' || n === 'PermissionDeniedError')
      return 'Izin kamera ditolak. Ketuk ikon gembok atau pengaturan di kolom alamat, ubah Kamera menjadi Izinkan, lalu muat ulang halaman.';
    if (n === 'NotFoundError' || n === 'DevicesNotFoundError' || n === 'OverconstrainedError')
      return 'Kamera tidak ditemukan di perangkat ini.';
    if (n === 'NotReadableError' || n === 'TrackStartError' || n === 'AbortError')
      return 'Kamera sedang dipakai aplikasi atau tab lain. Tutup yang lain, lalu coba lagi.';
    if (n === 'SecurityError')
      return 'Browser memblokir kamera di halaman ini. Pastikan alamat diawali https:// dan buka lewat Chrome atau Safari.';
    return 'Kamera gagal dibuka (' + (n || 'error tidak dikenal') + ').';
  }

  function fail(msg) {
    setStatus(msg, true);
    show('retry', true);
  }

  // ---- Buka kamera: coba beberapa pengaturan, dari yang ideal ke yang paling longgar ----
  async function openStream() {
    var tries = [
      { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
      { video: { facingMode: 'environment' }, audio: false },
      { video: true, audio: false }
    ];
    var lastErr;
    for (var i = 0; i < tries.length; i++) {
      try { return await navigator.mediaDevices.getUserMedia(tries[i]); }
      catch (e) {
        lastErr = e;
        if (e.name === 'NotAllowedError' || e.name === 'SecurityError' || e.name === 'NotReadableError') break;
      }
    }
    throw lastErr;
  }

  function stop() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    video.srcObject = null;
  }

  async function start(selectedRole) {
    stop();
    role = selectedRole || role;
    show('pilih', false); show('hasil', false); show('scanner', true); show('retry', false);
    setStatus('Meminta izin kamera… ketuk Izinkan bila muncul pertanyaan.');

    if (!window.isSecureContext) { fail('Halaman harus dibuka lewat HTTPS agar kamera bisa dipakai.'); return; }
    if (!hasApi) { fail('Browser ini tidak mendukung akses kamera.'); return; }
    if (typeof jsQR !== 'function') { fail('Pemindai QR gagal dimuat. Periksa koneksi internet, lalu muat ulang halaman.'); return; }

    try {
      stream = await openStream();
      video.setAttribute('playsinline', '');
      video.muted = true;
      video.srcObject = stream;
      await video.play();
      running = true;
      lastTick = 0;
      setStatus('Arahkan kamera ke QR code.');
      rafId = requestAnimationFrame(tick);
    } catch (e) {
      stop();
      fail(explainError(e));
    }
  }

  // ---- Baca frame kamera sekitar 10x per detik ----
  function tick(ts) {
    if (!running) return;
    rafId = requestAnimationFrame(tick);
    if (ts - lastTick < 100) return;
    lastTick = ts;
    if (video.readyState < 2 || !video.videoWidth) return;

    var scale = Math.min(1, 640 / video.videoWidth);
    var w = Math.round(video.videoWidth * scale);
    var h = Math.round(video.videoHeight * scale);
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
    ctx.drawImage(video, 0, 0, w, h);

    var img = ctx.getImageData(0, 0, w, h);
    var code = jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
    if (code && code.data) onResult(code.data, 'Kamera');
  }

  function onResult(text, how) {
    stop();
    if (navigator.vibrate) { try { navigator.vibrate(120); } catch (e) {} }
    $('resKode').textContent = text;
    $('resPeran').textContent = role || '(belum memilih peran)';
    $('resCara').textContent = how;
    $('resWaktu').textContent = new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta', dateStyle: 'full', timeStyle: 'medium' });
    show('scanner', false); show('pilih', false); show('hasil', true);
  }

  // ---- Tombol-tombol ----
  Array.prototype.forEach.call(document.querySelectorAll('[data-role]'), function (b) {
    b.addEventListener('click', function () { start(b.getAttribute('data-role')); });   // ketukan = izin memulai kamera
  });
  $('retry').addEventListener('click', function () { start(); });
  $('again').addEventListener('click', function () { start(); });
  $('cancel').addEventListener('click', function () { stop(); show('scanner', false); show('pilih', true); });
  $('back').addEventListener('click', function () { stop(); show('hasil', false); show('pilih', true); });
  $('manualBtn').addEventListener('click', function () {
    var v = $('manualInput').value.trim();
    if (v) onResult(v, 'Input manual');
  });

  // Matikan kamera kalau halaman disembunyikan (pindah tab / layar dikunci)
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && running) {
      stop();
      fail('Kamera dimatikan karena halaman ditinggalkan. Ketuk Coba lagi untuk menyalakan.');
    }
  });
  window.addEventListener('pagehide', stop);

  // ---- Info teknis ----
  (async function () {
    var lines = [];
    function yn(b) { return b ? 'ya' : 'tidak'; }
    lines.push('HTTPS / konteks aman : ' + yn(window.isSecureContext));
    lines.push('Di dalam frame       : ' + yn(inFrame));
    lines.push('Browser dalam aplikasi: ' + yn(inApp));
    lines.push('API kamera tersedia  : ' + yn(hasApi));
    lines.push('Pemindai QR dimuat   : ' + yn(typeof jsQR === 'function'));
    try {
      if (navigator.permissions && navigator.permissions.query) {
        var p = await navigator.permissions.query({ name: 'camera' });
        lines.push('Status izin kamera   : ' + p.state);
      } else { lines.push('Status izin kamera   : tidak bisa dicek di browser ini'); }
    } catch (e) { lines.push('Status izin kamera   : tidak bisa dicek di browser ini'); }
    try {
      if (hasApi && navigator.mediaDevices.enumerateDevices) {
        var d = await navigator.mediaDevices.enumerateDevices();
        lines.push('Jumlah kamera        : ' + d.filter(function (x) { return x.kind === 'videoinput'; }).length);
      }
    } catch (e) {}
    lines.push('Browser              : ' + ua);
    $('diag').textContent = lines.join('\n');
  })();
})();
</script>
</body>
</html>
